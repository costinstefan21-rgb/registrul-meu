name: Publicare redirectionare

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Pregateste redirectionarea
        run: |
          mkdir -p redirect-site
          cp index-3.html redirect-site/index-3.html
          touch redirect-site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: redirect-site

      - name: Publica
        id: deployment
        uses: actions/deploy-pages@v4
